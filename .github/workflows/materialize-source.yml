name: Materialize verified reference MP3

on:
  push:
    branches: [main]
    paths:
      - '.source_chunks/**'
      - '.github/workflows/materialize-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact source from transfer chunks
        run: python scripts/assemble_source.py
      - name: Commit verified source and remove temporary chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- examples/seatrus/source.mp3
          if [ -d .source_chunks ]; then git rm -r -- .source_chunks; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: materialize SHA-256 verified original audio"
            git push origin HEAD:main
          fi
